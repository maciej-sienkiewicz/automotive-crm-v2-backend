kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC

# Build cache: wynik zadania (compileKotlin, compileTestKotlin, test) jest zapisywany pod
# kluczem z jego wejść i odtwarzany zamiast liczenia od nowa. Największy zysk w CI daje
# merge develop -> main bez zmian w kodzie: te same źródła = kompilacja ORAZ testy z cache.
# Cache leży w GRADLE_USER_HOME/caches/build-cache-1, więc w CI działa tylko wtedy, gdy
# ten katalog przeżywa między buildami (patrz wolumen `gradle-cache` w Jenkinsfile).
org.gradle.caching=true
