apiVersion: 1

# disableDeletion is false here, unlike the provider this replaces.
#
# The previous one set it to true, which means Grafana keeps serving a provisioned
# dashboard after its file is deleted from the repository — the file goes, the dashboard
# stays in Grafana's own database, orphaned, and the only way to remove it is by hand
# through the API. That is how "Detailing CRM – Observability" survived being deleted and
# went on looking like the current dashboard weeks after it stopped being one.
#
# With deletion enabled, the repository is the source of truth in both directions:
# removing a file removes the dashboard.

providers:
  - name: 'CRM Platform Dashboards'
    orgId: 1
    folder: 'Detailing CRM'
    folderUid: 'detailing-crm'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
