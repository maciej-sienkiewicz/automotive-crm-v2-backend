# Wariant develop konfiguracji Prometheusa — różnice względem prometheus.yml:
# - target scrape'u to kontener backendu develop (nazwa z DEVELOP_ENV_FILE:
#   DETAILING_CRM_BACKEND_CONTAINER_NAME=detailing-crm-backend-develop),
# - etykieta środowiska 'develop' zamiast 'production'.
# Prometheus nie interpoluje zmiennych środowiskowych, stąd osobny plik.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: 'develop'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'detailing-crm'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['detailing-crm-backend-develop:8080']
        labels:
          application: 'detailing-crm'
