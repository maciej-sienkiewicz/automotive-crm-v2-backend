groups:
  - name: crm_security
    interval: 30s
    rules:

      # ── Brute-force / credential stuffing ──────────────────────────────────
      - alert: LoginBruteForce
        expr: |
          rate(crm_security_login_attempts_total{result="failure"}[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Podejrzana liczba błędnych prób logowania"
          description: >
            Więcej niż 1 błędna próba logowania na 2 sekundy przez ostatnie 2 minuty.
            Może oznaczać atak brute-force lub credential stuffing.

      - alert: AccountLockoutSpike
        expr: |
          increase(crm_security_login_attempts_total{result="locked"}[10m]) > 3
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Masowe blokady kont w krótkim czasie"
          description: >
            Ponad 3 konta zostały zablokowane w ciągu 10 minut.
            Może oznaczać skoordynowany atak na znane adresy e-mail.

      # ── Rate limiting ───────────────────────────────────────────────────────
      - alert: RateLimitExceeded
        expr: |
          rate(crm_security_rate_limit_exceeded_total[5m]) > 0.1
        for: 1m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Przekroczenia limitów żądań (HTTP 429)"
          description: >
            Endpoint {{ $labels.path }} regularnie przekracza rate limit.
            Może oznaczać atak DoS lub nieprawidłowo skonfigurowanego klienta.

      # ── Cross-tenant access ─────────────────────────────────────────────────
      - alert: CrossTenantAccessAttempt
        expr: |
          increase(crm_security_cross_tenant_attempt_total[15m]) > 0
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Próba dostępu do danych innego tenanta!"
          description: >
            Studio {{ $labels.studio_id }} próbowało uzyskać dostęp do encji {{ $labels.entity_type }}
            należącej do innego tenanta. Sprawdź audit_logs tabeli SECURITY.

      # ── Anomalous 401/403 rejections ────────────────────────────────────────

  # ── Telemetria zaangażowania ────────────────────────────────────────────────
  # Wszystkie trzy reguły pilnują tego samego: żeby liczby na dashboardach Zaangażowanie
  # i Adopcja były kompletne. Niepełne dane wyglądają tu dokładnie jak spokojny tydzień
  # u klienta, więc bez alertu nikt by się nie zorientował — a na ich podstawie zapadają
  # decyzje o tym, którego klienta trzeba dosprzedać albo uratować.
  - name: crm_live_metrics
    interval: 60s
    rules:

      - alert: LiveMetricsPipelineDropping
        expr: |
          increase(crm_live_metrics_pipeline_dropped[15m]) > 0
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Potok live-metrics gubi zdarzenia biznesowe"
          description: >
            Kolejka ingestu przepełniła się albo zapis do Redisa nie przeszedł.
            Zdarzenia zgubione w ten sposób nie wracają — liczniki narastające
            zaniżą się trwale. Sprawdź dostępność Redisa i crm_live_metrics_pipeline_queued.

      - alert: LiveMetricsIngestQueueSaturated
        expr: |
          sum(crm_live_metrics_pipeline_queued) / sum(crm_live_metrics_pipeline_queue_capacity) > 0.7
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Kolejka ingestu live-metrics zapełniona w ponad 70%"
          description: >
            Worker nie nadąża opróżniać kolejki. To stan PRZED gubieniem zdarzeń —
            jeśli zapełnienie rośnie, LiveMetricsPipelineDropping odpali za chwilę.

      # Nieudane odświeżenie ZOSTAWIA poprzednie wartości gauge'y (MultiGauge ich nie zeruje),
      # więc martwy eksporter wygląda jak zamrożona prawda. Wiek ostatniego udanego cyklu
      # jest jedynym sygnałem, który to rozróżnia.
      - alert: TenantStateGaugesStale
        expr: |
          time() - max(crm_tenant_state_refreshed_seconds) > 900
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Stany tenantów nie odświeżyły się od 15 minut"
          description: >
            Kafle „Tak/Nie" i wielkości bieżące (usługi, pracownicy, kredyty SMS) pokazują
            wartości zamrożone w przeszłości. Sprawdź logi TenantStateMetricsExporter —
            najczęstsza przyczyna to błąd SQL po migracji schematu.

  - name: crm_ksef_limits
    interval: 60s
    rules:

      # ── Zbliżanie się do limitu KSeF ────────────────────────────────────────
      # Limity KSeF są naliczane per kontekst NIP, więc alert ma sens wyłącznie
      # per najemca — suma platformy nie powie, kto za chwilę zobaczy 429.
      - alert: KsefTenantNearHourlyLimit
        expr: |
          crm_ksef_api_window_utilization{ksef_window="hour"} >= 0.8
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Studio {{ $labels.studio_id }} blisko godzinowego limitu KSeF"
          description: >
            Studio zużyło co najmniej 80% godzinowego budżetu żądań do KSeF.
            Kolejne pobrania faktur zaczną być wstrzymywane, a synchronizacja
            przestanie domykać się w jednym cyklu.

      - alert: KsefTenantHourlyLimitExhausted
        expr: |
          crm_ksef_api_window_utilization{ksef_window="hour"} >= 1
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Studio {{ $labels.studio_id }} wyczerpało godzinowy limit KSeF"
          description: >
            Budżet żądań na godzinę jest wyczerpany. Sprawdź, czy studio nie ma
            zaległości w synchronizacji większej, niż limit pozwala nadrobić.

      # ── Odmowy po stronie KSeF ──────────────────────────────────────────────
      # To inny sygnał niż powyższe: znaczy, że nasze wyhamowanie zadziałało
      # za późno albo za słabo i KSeF odrzucił żądanie.
      - alert: KsefRateLimitRejections
        expr: |
          increase(crm_ksef_api_requests_total{result="rate_limited"}[15m]) > 0
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "KSeF odrzuca żądania studia {{ $labels.studio_id }} (429)"
          description: >
            Operacja {{ $labels.ksef_operation }} dostała odmowę z powodu limitu.
            Sprawdź tempo żądań w KsefInvoiceXmlFetcher i budżet godzinowy.

      # ── Synchronizacja, która się nie domyka ────────────────────────────────
      - alert: KsefSyncPersistentlyDeferred
        expr: |
          increase(crm_ksef_api_deferred_total[6h]) > 12
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Synchronizacja KSeF studia {{ $labels.studio_id }} nie nadąża"
          description: >
            Przebiegi synchronizacji były wstrzymywane ponad 12 razy w ciągu 6 godzin
            z powodu {{ $labels.reason }}. Zaległość dokumentów rośnie szybciej,
            niż limit KSeF pozwala ją nadrobić — podgląd faktur zostaje bez pozycji.

      # ── Błędy komunikacji z KSeF ────────────────────────────────────────────
      - alert: KsefApiErrorRate
        expr: |
          sum by (studio_id) (rate(crm_ksef_api_requests_total{result="error"}[15m]))
            /
          sum by (studio_id) (rate(crm_ksef_api_requests_total[15m])) > 0.25
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Ponad 25% żądań do KSeF studia {{ $labels.studio_id }} kończy się błędem"
          description: >
            Sprawdź ważność tokenu KSeF studia i dostępność API Ministerstwa Finansów.

  # ── Odczyt profili IG reklamodawców ─────────────────────────────────────────
  - name: meta_ig_resolver
    interval: 60s
    rules:

      # Kanarek jest jedynym sposobem wykrycia przebudowy Biblioteki reklam.
      # Bez niego awaria byłaby niewidoczna: po zmianie strony każdy odczyt
      # zacząłby wracać jako „reklamodawca nie ma Instagrama" — wynik normalny,
      # częsty i nie do odróżnienia od prawdy. Miernik pyta codziennie o stronę,
      # o której wiemy, że profil ma.
      - alert: MetaIgResolverPadl
        expr: crm_meta_ig_canary == 0
        for: 2h
        labels:
          severity: warning
          team: produkt
        annotations:
          summary: "Odczyt profili IG reklamodawców przestał działać"
          description: >
            Kanarek nie znalazł profilu na stronie, o której wiemy, że go ma.
            Najpewniej Meta przebudowała Bibliotekę reklam i ścieżka kliknięć
            w sidecarze meta-ig-resolver przestała pasować. Nazwy zebrane
            wcześniej są nietknięte, ale nowych nie ustalimy do czasu poprawki.
            To utrata funkcji pomocniczej, nie awaria CRM-a.

      # Pojedyncze niepowodzenia są normalne (wolna odpowiedź Meta, chwilowa
      # blokada). Dopiero gdy PRAWIE WSZYSTKO zawodzi przez godzinę, coś jest
      # nie tak z samym sidecarem — najczęściej nie wstał albo brakuje mu pamięci.
      - alert: MetaIgResolverGlownieBledy
        expr: |
          sum(rate(crm_meta_ig_lookups_total{result=~"blocked|timeout|error"}[1h]))
            /
          clamp_min(sum(rate(crm_meta_ig_lookups_total[1h])), 0.0001) > 0.9
        for: 1h
        labels:
          severity: warning
          team: produkt
        annotations:
          summary: "Ponad 90% odczytów profili IG kończy się niepowodzeniem"
          description: >
            Sprawdź, czy kontener meta-ig-resolver działa i czy nie jest
            ubijany przez limit pamięci: docker logs meta-ig-resolver.
