services:
  detailing-crm-backend:
    image: ${ENV_DETAILING_CRM_BACKEND_IMAGE}
    container_name: ${DETAILING_CRM_BACKEND_CONTAINER_NAME}
    ports:
      - '${ENV_DETAILING_CRM_BACKEND_EXTERNAL_PORT}:8080'
      - '${ENV_DETAILING_CRM_BACKEND_DEBUG_PORT}:5005'
    restart: always
    environment:
      DB_ADDR: ${ENV_DB_ADDR}
      DB_PORT: ${ENV_DB_PORT}
      DB_NAME: ${ENV_DB_NAME}
      DB_USER: ${ENV_DB_USER}
      DB_PASSWORD: ${ENV_DB_PASSWORD}
      REDIS_ADDR: ${ENV_REDIS_ADDR}
      REDIS_PORT: ${ENV_REDIS_PORT}
      S3_ACCESS_KEY: ${ENV_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${ENV_S3_SECRET_KEY}
      GITHUB_ACTOR: ${ENV_GITHUB_ACTOR}
      GITHUB_TOKEN: ${ENV_GITHUB_TOKEN}
      OPENAI_API_KEY: ${ENV_OPENAI_API_KEY}
      SMSAPI_OAUTH_TOKEN: ${ENV_SMSAPI_OAUTH_TOKEN}
      CLOUDFLARE_EMAIL_WEBHOOK_TOKEN: ${ENV_CLOUDFLARE_EMAIL_WEBHOOK_TOKEN}
      APP_ENV: ${ENV_APP_ENV:-production}
      GUS_API_KEY: ${ENV_GUS_API_KEY}
      ENV_GUS_ENDPOINT_URL: ${ENV_GUS_ENDPOINT_URL}
      MAIL_USERNAME: ${ENV_MAIL_USERNAME}
      MAIL_PASSWORD: ${ENV_MAIL_PASSWORD}
      MAIL_HOST: ${ENV_MAIL_HOST}
      RAPIDAPI_KEY: ${ENV_RAPIDAPI_KEY}
      MAILBOX_ENCRYPTION_KEY: ${ENV_MAILBOX_ENCRYPTION_KEY}
      REPORT_PROBLEM_EMAIL: ${ENV_REPORT_PROBLEM_EMAIL}
    depends_on:
      - redis
    networks:
      - network

  redis:
    image: redis:alpine
    networks:
      - network

  # ── Observability Stack ─────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: detailing-crm-prometheus
    restart: unless-stopped
    ports:
      - "${ENV_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # prometheus.yml wskazuje rule_files: alerts.yml — bez tego mountu Prometheus
      # nie może załadować konfiguracji i pada przy starcie
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: detailing-crm-grafana
    restart: unless-stopped
    ports:
      - "${ENV_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${ENV_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ENV_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${ENV_GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
      GF_LOG_LEVEL: "error"
      GF_LOG_FILTERS: "rendering:error provisioning.dashboard:critical"
      # Postgres datasource for the product-analytics dashboards. Those metrics live in
      # the CRM database, not in Prometheus (tenant id as a Prometheus label would explode
      # cardinality and the retention needed is years), so Grafana has to reach them here.
      #
      # The account is grafana_ro from V66__metrics_grafana_readonly.sql: SELECT on the
      # metric_* tables and a two-column studio directory, nothing else. It cannot read a
      # customer, a visit, an invoice or an error stack trace even if a query asks for one —
      # which matters, because GF_AUTH_ANONYMOUS_ENABLED is true on this deployment.
      #
      # ENV_GRAFANA_DB_PASSWORD has no default on purpose: an empty password fails the
      # connection loudly instead of quietly falling back to a shared account.
      GRAFANA_DB_HOST: ${ENV_GRAFANA_DB_HOST:-${ENV_DB_ADDR}}
      GRAFANA_DB_PORT: ${ENV_GRAFANA_DB_PORT:-${ENV_DB_PORT}}
      GRAFANA_DB_NAME: ${ENV_GRAFANA_DB_NAME:-${ENV_DB_NAME}}
      GRAFANA_DB_USER: ${ENV_GRAFANA_DB_USER:-grafana_ro}
      GRAFANA_DB_PASSWORD: ${ENV_GRAFANA_DB_PASSWORD}
      GRAFANA_DB_SSLMODE: ${ENV_GRAFANA_DB_SSLMODE:-disable}
    depends_on:
      - prometheus
    networks:
      - network

volumes:
  prometheus_data:
  grafana_data:

networks:
  network:
    name: ${ENV_NETWORK}
    external: true
