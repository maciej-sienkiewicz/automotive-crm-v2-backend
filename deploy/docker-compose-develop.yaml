# Jawna nazwa projektu Compose. Bez niej projekt bierze nazwę z katalogu
# (/opt/apps/{env}/app-backend → "app-backend" dla OBU środowisk), przez co
# deploy develop z --remove-orphans adoptowałby i USUWAŁ kontenery produkcyjne
# (inne klucze serwisów w tym samym projekcie = "osierocon").
name: app-backend-develop

services:
  detailing-crm-backend-develop:
    image: ${ENV_DETAILING_CRM_BACKEND_IMAGE}
    container_name: ${DETAILING_CRM_BACKEND_CONTAINER_NAME}
    ports:
      - '${ENV_DETAILING_CRM_BACKEND_EXTERNAL_PORT}:8080'
      - '${ENV_DETAILING_CRM_BACKEND_DEBUG_PORT}:5005'
    restart: always
    environment:
      DB_ADDR: ${ENV_DB_ADDR}
      DB_PORT: ${ENV_DB_PORT}
      DB_NAME: ${ENV_DB_NAME}
      DB_USER: ${ENV_DB_USER}
      DB_PASSWORD: ${ENV_DB_PASSWORD}
      REDIS_ADDR: ${ENV_REDIS_ADDR}
      REDIS_PORT: ${ENV_REDIS_PORT}
      S3_ACCESS_KEY: ${ENV_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${ENV_S3_SECRET_KEY}
      GITHUB_ACTOR: ${ENV_GITHUB_ACTOR}
      GITHUB_TOKEN: ${ENV_GITHUB_TOKEN}
      OPENAI_API_KEY: ${ENV_OPENAI_API_KEY}
      SMSAPI_OAUTH_TOKEN: ${ENV_SMSAPI_OAUTH_TOKEN}
      # Whitelista odbiorców wiadomości do klientów (RecipientWhitelistProperties).
      # enabled=true + puste listy = blokada wszystkich klientów; przekierowanie studia na własne dane działa niezależnie.
      # Go-live = ENV_COMMUNICATION_WHITELIST_ENABLED=false.
      COMMUNICATION_WHITELIST_ENABLED: ${ENV_COMMUNICATION_WHITELIST_ENABLED:-true}
      COMMUNICATION_WHITELIST_PHONES: ${ENV_COMMUNICATION_WHITELIST_PHONES:-}
      COMMUNICATION_WHITELIST_EMAILS: ${ENV_COMMUNICATION_WHITELIST_EMAILS:-}
      CLOUDFLARE_EMAIL_WEBHOOK_TOKEN: ${ENV_CLOUDFLARE_EMAIL_WEBHOOK_TOKEN}
      APP_ENV: ${ENV_APP_ENV:-develop}
      GUS_API_KEY: ${ENV_GUS_API_KEY}
      ENV_GUS_ENDPOINT_URL: ${ENV_GUS_ENDPOINT_URL}
      MAIL_USERNAME: ${ENV_MAIL_USERNAME}
      MAIL_PASSWORD: ${ENV_MAIL_PASSWORD}
      MAIL_HOST: ${ENV_MAIL_HOST}
      RAPIDAPI_KEY: ${ENV_RAPIDAPI_KEY}
      MAILBOX_ENCRYPTION_KEY: ${ENV_MAILBOX_ENCRYPTION_KEY}
      REPORT_PROBLEM_EMAIL: ${ENV_REPORT_PROBLEM_EMAIL}
      VAPID_PUBLIC_KEY: ${ENV_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${ENV_VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${ENV_VAPID_SUBJECT}
    depends_on:
      - redis
    networks:
      - network

  redis:
    image: redis:alpine
    networks:
      - network

  # ── Observability Stack ─────────────────────────────────────────────────────
  # Nazwy kontenerów i wolumeny mają sufiks -develop, aby środowisko develop mogło
  # współistnieć z produkcyjnym na tym samym hoście Dockera bez kolizji.

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: detailing-crm-prometheus-develop
    restart: unless-stopped
    ports:
      - "${ENV_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      # Wariant develop: scrape celuje w kontener backendu develop, etykieta środowiska 'develop'
      - ./monitoring/prometheus/prometheus-develop.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - network

  # Klucz serwisu z sufiksem -develop: nazwa serwisu jest aliasem DNS w sieci,
  # a nginx-proxy-manager jest wpięty w sieć prod ORAZ develop — serwis "grafana"
  # w obu sieciach sprawiłby, że grafana.detailboost.pl (cel http://grafana:3000)
  # rozwiązywałby się losowo między środowiskami.
  grafana-develop:
    image: grafana/grafana:11.0.0
    container_name: detailing-crm-grafana-develop
    restart: unless-stopped
    ports:
      - "${ENV_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${ENV_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ENV_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${ENV_GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
      GF_LOG_LEVEL: "error"
      GF_LOG_FILTERS: "rendering:error provisioning.dashboard:critical"
    depends_on:
      - prometheus
    networks:
      - network

volumes:
  prometheus_data:
  grafana_data:

networks:
  network:
    name: ${ENV_NETWORK}
    external: true
