spring.application.name=detailing-crm

# CardDAV: pass OPTIONS through DispatcherServlet so CardDavController can set DAV headers
spring.mvc.dispatch-options-request=true
  
  # Database
spring.datasource.url=jdbc:postgresql://${DB_ADDR:localhost}:${DB_PORT:5432}/${DB_NAME:detailing_crm}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
  
  # JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flywayy
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# Redis
spring.data.redis.host=${REDIS_ADDR:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.session.store-type=redis

  # Server
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

  # Logging
logging.level.root=INFO
logging.level.pl.detailing.crm=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

# Jackson
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# AWS S3 Configuration
aws.s3.region=us-east-1
aws.s3.bucket-name=detailing-crm-test
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}

# Multipart / file upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Photo Upload Configuration
photo-upload.session-ttl-hours=2
photo-upload.max-photos-per-session=20

# Checkin QR Upload Configuration
# TTL for upload tokens stored in Redis (hours); also controls S3 delete-after tag value
checkin.upload-token-ttl-hours=3

# KSeF Integration (production)
# Test:       https://api-test.ksef.mf.gov.pl
# Production: https://api.ksef.mf.gov.pl
ksef.base-url=https://api.ksef.mf.gov.pl
ksef.api-path=/api/v2
ksef.request-timeout-seconds=30
# Host weryfikacji kodow QR (KOD I). Puste = wyprowadzone z ksef.base-url
# Test: https://qr-test.ksef.mf.gov.pl  Produkcja: https://qr.ksef.mf.gov.pl
ksef.qr-base-url=

# Progi limitow KSeF uzywane WYLACZNIE przez metryki (crm_ksef_api_window_utilization).
# Odpowiadaja najostrzejszym udokumentowanym limitom API (pobranie faktury po numerze).
# Tempem zadan steruje KsefInvoiceXmlFetcher, nie te wartosci.
ksef.requests-per-minute-limit=16
ksef.requests-per-hour-limit=64

# KSeF Background Sync
# interval-ms      – co ile ms uruchamiany jest kolejny sync (domyslnie 15 min = 900 000 ms)
# initial-delay-ms – opoznienie pierwszego uruchomienia po starcie aplikacji (domyslnie 60 s)
ksef.sync.interval-ms=900000
ksef.sync.initial-delay-ms=60000

# Instagram Competitor Tracker – RapidAPI
# Klucz RapidAPI – WYLACZNIE przez zmienna srodowiskowa RAPIDAPI_KEY (bez wartosci domyslnej).
# UWAGA: poprzedni klucz byl zacommitowany w repo – nalezy go zrotowac w panelu RapidAPI.
instagram.rapidapi.key=${RAPIDAPI_KEY:}
# Aktywny dostawca danych: LOOTER (instagram-looter2) | IG_SCRAPER5 (legacy)
instagram.provider=LOOTER
instagram.looter.host=instagram-looter2.p.rapidapi.com
instagram.rapidapi.host=ig-scraper5.p.rapidapi.com
instagram.rapidapi.timeout-seconds=30
# Ochrona quoty: limit req/s i twardy dzienny budzet wywolan (wszystkie endpointy lacznie)
instagram.rapidapi.rate-limit-per-second=4
instagram.rapidapi.daily-budget=2000

# Instagram sync tygodniowy (gleboki, niedziela 03:00) + dzienny (lekki, 06:30)
# Format Spring cron: sekunda minuta godzina dzien miesiac dzien-tygodnia
instagram.sync.enabled=true
instagram.sync.cron=0 0 3 * * SUN
instagram.sync.deep-max-pages=8
instagram.sync.backfill-max-pages=31
instagram.daily-sync.enabled=true
instagram.daily-sync.cron=0 30 6 * * *

# Retencja danych (RODO): snapshoty 24 mies., insighty 12 mies.
instagram.retention.enabled=true
instagram.retention.months=24
instagram.retention.cron=0 0 4 1 * *

# Endpointy diagnostyczne AI (ab-test, negative-impact-test, debug-generate)
instagram.ai.debug-endpoints.enabled=false
# Limit generowania postow AI per STUDIO (InstagramAiRateLimiter, osobny od RateLimitFilter per-IP).
# Jedno zadanie /generate to do 7 wywolan LLM (generator + weryfikacje + korekty),
# wiec dzienny budzet OpenAI na studio to per-day x 7 wywolan.
instagram.ai.rate-limit.per-hour=10
instagram.ai.rate-limit.per-day=40

# Puls konkurencji (zakładka Porównanie) liczony jest w całości w kodzie — bez modelu AI,
# bez limitów i bez cache. Norma profilu pochodzi z 26 tygodni (CompetitorPulseService).

# Ręczne ponowienie pobrania danych dla profili z błędem: odstęp między kliknięciami
# per studio. Chroni dzienny budżet RapidAPI; liczy się dopiero, gdy realnie coś ponawialiśmy.
instagram.resync.cooldown-minutes=10

# SMSAPI Integration (smsapi-lib:3.0.1)
# oauth-token – OAuth token from the SMSAPI panel; set via env var SMSAPI_OAUTH_TOKEN in production
# NOTE: there is no global sender name. The sender header comes from the studio's own
#       sms_automation_configs.sms_sender_name (only once sms_api_name_confirmed = true);
#       studios without a confirmed header send as ECO — from an SMSAPI number, no header.
#       A placeholder header such as "Test" must never be configured here again.
# api-url     – Gateway URL: https://api.smsapi.pl/ (PL) | https://api.smsapi.com/ (COM) | https://smsapi.io/ (SE/BG)
# enabled     – Set to true in production to actually dispatch SMS messages
smsapi.oauth-token=${ENV_SMSAPI_OAUTH_TOKEN:}
smsapi.api-url=https://api.smsapi.pl/
smsapi.enabled=true

# Web Push / VAPID (Click-to-Call: desktop klika numer -> telefon dostaje push)
# public-key  – klucz aplikacyjny (base64url, nieskompresowany punkt P-256, 65 B);
#               ten sam klucz trafia do przeglądarki jako applicationServerKey
# private-key – surowy 32-bajtowy skalar P-256 (base64url); TYLKO przez env var
# subject     – kontakt operatora wymagany przez RFC 8292 (mailto: lub https:)
# Parę kluczy generuje się RAZ na środowisko (nie jest związana z maszyną):
#   docker run --rm node:20-alpine npx -y web-push generate-vapid-keys
# albo WebPushCrypto.generateVapidKeyPair(). Klucz prywatny trafia WYŁĄCZNIE do
# pliku .env obok docker-compose (ENV_VAPID_PRIVATE_KEY), nigdy do repozytorium.
# Rotacja kluczy unieważnia wszystkie subskrypcje w push_devices — telefony
# muszą sparować się od nowa, więc zmieniamy je tylko przy wycieku.
webpush.vapid.public-key=${VAPID_PUBLIC_KEY:}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY:}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:kontakt@detailboost.pl}

# Email / JavaMail (transactional mail – welcome email + protocol attachment)
# host     – SMTP server hostname; override with env var MAIL_HOST in production
# port     – SMTP port (587 = STARTTLS, 465 = SSL/TLS, 25 = plain)
# username – SMTP account login; override with env var MAIL_USERNAME
# password – SMTP account password; override with env var MAIL_PASSWORD
# enabled  – Set to false to only log messages without sending (dev/test)
email.javamail.host=${MAIL_HOST:serwer2486743.home.pl}
email.javamail.port=${MAIL_PORT:587}
email.javamail.username=${MAIL_USERNAME:crm1@sienkiewicz-maciej.pl}
email.javamail.password=${MAIL_PASSWORD:}
email.javamail.smtp-auth=true
email.javamail.smtp-starttls-enable=true
email.javamail.enabled=true

# ─── Zgłoś problem (in-app bug/issue report) ────────────────────────────────────
# recipient-email – where "Zgłoś problem" reports are emailed; override with env var REPORT_PROBLEM_EMAIL
support.report.recipient-email=${REPORT_PROBLEM_EMAIL:kontakt@sienkiewicz-maciej.pl}

# ─── Password reset (self-service) ──────────────────────────────────────────────
# token-ttl-minutes        – how long a reset link stays valid (default 30 min)
# request-cooldown-seconds – min interval between two reset emails for the same address
# frontend-base-url        – origin used to build the reset link in the email;
#                            override with env var FRONTEND_BASE_URL in production
auth.password-reset.token-ttl-minutes=30
auth.password-reset.request-cooldown-seconds=60
auth.password-reset.frontend-base-url=${FRONTEND_BASE_URL:https://detailboost.pl}

# 2-way SMS (consent requests for service scope changes)
# Sekret webhooka odpowiedzi przychodzacych (bez wartosci domyslnej = webhook WYLACZONY).
# Wpisz go w adresie callbacku w panelu SMSAPI:  https://<domena>/api/sms/inbound?secret=<wartosc>
# (alternatywnie naglowek X-Webhook-Secret). Bez sekretu kazdy mogl podrobic odpowiedz
# "TAK" (zatwierdzenie platnych uslug) albo "STOP" (masowe wypisanie z kampanii).
smsapi.inbound-webhook-secret=${SMSAPI_INBOUND_WEBHOOK_SECRET:}

# To enable inbound replies, configure the callback URL in the SMSAPI panel:
#   Account → Settings → 2-way SMS → Callback URL
#   → https://<your-domain>/api/sms/inbound
# SMSAPI will POST inbound customer replies to that URL.
# No additional properties are required here — the endpoint is already registered.

# ─── Instagram AI Post Generation ──────────────────────────────────────────────
# OpenAI API – ustaw przez zmienną środowiskową OPENAI_API_KEY w produkcji
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
# Model osobno dla każdego kroku pętli; puste = model globalny powyżej, czyli zero zmiany kosztu.
# Najwięcej daje mocniejszy GENERATOR: to on pisze tekst, trzymając naraz wszystkie reguły
# studia. Weryfikator ocenia już tylko reguły jakościowe (policzalne liczy kod), a
# klasyfikator wybiera jedną z czterech etykiet — obu wystarcza model najtańszy.
instagram.ai.model.generator=${INSTAGRAM_AI_GENERATOR_MODEL:gpt-4.1}
instagram.ai.model.verifier=${INSTAGRAM_AI_VERIFIER_MODEL:}
instagram.ai.model.corrector=${INSTAGRAM_AI_CORRECTOR_MODEL:}
instagram.ai.model.classifier=${INSTAGRAM_AI_CLASSIFIER_MODEL:}
# Embedding model (text-embedding-3-small: 1536 dims)
spring.ai.openai.embedding.options.model=text-embedding-3-small

# pgvector – baza wektorowa dla Few-Shot przykładów
# Tabela: instagram_post_vectors (osobna od innych VectorStore)
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=instagram_post_vectors

# Audio transcription (Whisper) – voice-to-text for mobile app
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pl

# Logowanie modułu AI
logging.level.org.springframework.ai=INFO
logging.level.pl.detailing.crm.instagram.ai=DEBUG

# CloudFlare Email Webhook
# Shared secret token sent by CloudFlare Email Workers in the X-Cloudflare-Email-Token header.
# REQUIRED in production — set via env var CLOUDFLARE_EMAIL_WEBHOOK_TOKEN.
# If left empty, the webhook endpoint will reject ALL requests with HTTP 401.
cloudflare.email.webhook.secret-token=${CLOUDFLARE_EMAIL_WEBHOOK_TOKEN:}

# ─── Mailbox (IMAP/SMTP per studio) ─────────────────────────────────────────────
# Key used to encrypt stored mailbox passwords (AES-GCM).
# REQUIRED before any mailbox can be connected — set via env var MAILBOX_ENCRYPTION_KEY.
# If left empty, connecting a mailbox fails loudly instead of storing weakly protected credentials.
# Changing this key makes already-stored passwords undecryptable — studios must reconnect.
mailbox.encryption.secret-key=${MAILBOX_ENCRYPTION_KEY:}

# ─── Spring Boot Actuator + Prometheus ────────────────────────────────────────
# /actuator/prometheus jest źródłem danych dla dashboardów Grafany (live-metrics:
# liczniki zdarzeń biznesowych per tenant, liczniki bezpieczeństwa, limity KSeF).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:local}

# ── GUS BIR Integration ───────────────────────────────────────────────────────
# Test env key (well-known): abcde12345abcde12345
# Production: ustaw zmienną środowiskową GUS_API_KEY
gus.api-key=${GUS_API_KEY:abcde12345abcde12345}
# Endpoint produkcyjny (domyślny). Testowy: https://wyszukiwarkaregontest.stat.gov.pl/wsBIR/UslugaBIRzewnPubl.svc
gus.endpoint-url=${GUS_ENDPOINT_URL:https://wyszukiwarkaregon.stat.gov.pl/wsBIR/UslugaBIRzewnPubl.svc}
gus.connect-timeout-ms=5000
gus.read-timeout-ms=15000
# Sesja GUS wygasa po 60 min – odświeżamy po 55 min z marginesem bezpieczeństwa
gus.session-ttl-minutes=55
# Cache Redis – dane firm rzadko się zmieniają (default: 24 h)
gus.cache-ttl-hours=24
gus.retry-max-attempts=3
gus.retry-initial-delay-ms=1000
gus.circuit-breaker-failure-rate-threshold=50
gus.circuit-breaker-wait-duration-seconds=60
gus.circuit-breaker-sliding-window-size=10
# ── eIDAS Tablet Signing (podpis na tablecie) ─────────────────────────────────
# TTL of a signing session (request + anti-replay challenge)
signing.request.ttl-minutes=15
# Default declaration shown above the signature pad (can be overridden per request)
signing.request.default-declaration=O\u015Bwiadczam, \u017Ce zapozna\u0142em/zapozna\u0142am si\u0119 z tre\u015Bci\u0105 niniejszego dokumentu, rozumiem jego tre\u015B\u0107 i akceptuj\u0119 zawarte w nim ustalenia.
# Tablet pairing
signing.tablet.pairing-code-ttl-minutes=5
# Parowanie tabletu nie wygasa z upływem czasu — kończy je wyłącznie odłączenie
# urządzenia w ustawieniach. Dawna właściwość signing.tablet.token-ttl-days
# odeszła razem z trzymaniem tokenów w cache'u (patrz migracja V70).

# ─── Przelewy24 ────────────────────────────────────────────────────────────────
# Credentials are taken from env vars. Without credentials the system auto-mocks
# (orders fulfilled immediately, no P24 call). Set P24_MOCK_MODE=true to force
# mock even when credentials are present (e.g. running integration tests locally).
# sandbox=true → sandbox.przelewy24.pl; sandbox=false → secure.przelewy24.pl
p24.mock-mode=${P24_MOCK_MODE:false}
p24.sandbox=${P24_SANDBOX:true}
p24.merchant-id=${P24_MERCHANT_ID:0}
p24.pos-id=${P24_POS_ID:0}
p24.crc=${P24_CRC:}
p24.api-key=${P24_API_KEY:}
p24.frontend-base-url=${FRONTEND_BASE_URL:https://detailboost.pl}
p24.backend-base-url=${BACKEND_BASE_URL:https://api.detailboost.pl}

# Raport tygodnia: narracja LLM (fallback: szablon deterministyczny)
instagram.report.ai.enabled=true

# ─── Live metrics: śledzenie zdarzeń biznesowych w czasie rzeczywistym ────────
# Każda akcja biznesowa (rezerwacja, wizyta, usługa, zdjęcie, wpis aktywności)
# emituje zdarzenie z tenantId i znacznikiem czasu. Zdarzenia trafiają do Redis
# Streams (transport między instancjami) i do liczników kubełkowych w Redisie
# (minuta / godzina / dzień per tenant). Odbiorcą jest OPERATOR CRM-a, nie studio:
# Grafana czyta liczniki `crm_business_events_*` z /actuator/prometheus
# (deploy/monitoring/grafana), a konsola platformy /api/internal/live-metrics
# dostaje te same zdarzenia na żywo przez SSE.
crm.live-metrics.enabled=true

# Klucz dostępu do konsoli platformy (/api/internal/**), nagłówek X-Platform-Key.
# Pusty = konsola ZAMKNIĘTA (HTTP 503). Ustaw wyłącznie zmienną środowiskową w produkcji.
crm.live-metrics.platform-api-key=${PLATFORM_METRICS_KEY:}

# Strefa czasowa kubełków (godzina „w której klienci rezerwują” to godzina lokalna studia).
crm.live-metrics.zone=Europe/Warsaw

# Retencja kubełków w Redisie. Kubełki dzienne i liczniki sumaryczne nie wygasają.
crm.live-metrics.retention.minute-days=3
crm.live-metrics.retention.hour-days=90
# Co ile sekund gauge'e Prometheus (dziś, profil godzinowy, potok) są odświeżane z Redisa.
crm.live-metrics.prometheus-refresh-seconds=15
# Ile ostatnich zdarzeń trzymamy per tenant (i dla całej platformy) do podglądu
# w konsoli operatora.
crm.live-metrics.recent-events=200
# Maksymalna (przybliżona) długość strumienia Redis `lm:events`.
crm.live-metrics.stream-max-length=100000

# Hot path nigdy nie blokuje: zdarzenie ląduje w ograniczonej kolejce w pamięci,
# osobny wątek zapisuje partie do Redisa w jednym pipeline.
crm.live-metrics.ingest.queue-capacity=20000
crm.live-metrics.ingest.batch-size=500
crm.live-metrics.ingest.flush-interval-ms=250

# ── Nieukończone przyjęcia pojazdu (wizyty w statusie DRAFT) ──────────────────
# DRAFT jest stanem kreatora przyjęcia, nie stanem biznesowym wizyty: powstaje przy
# zapisie przyjęcia i znika przy zatwierdzeniu albo anulowaniu. Poniższe progi mówią,
# kiedy otwarte przyjęcie uznajemy za zaległe (wyróżnienie w kolejce obsługi), a kiedy
# za porzucone (automatyczne anulowanie).
crm.visits.drafts.stale-after-hours=2
crm.visits.drafts.cleanup-enabled=true
# Ostrożnie: szkic niesie zdjęcia, mapę uszkodzeń i wygenerowane protokoły. Doba z hakiem
# przechodzi przez noc i przez zmianę, więc obsługa ma realną szansę domknąć przyjęcie
# ręcznie, zanim zrobi to system.
crm.visits.drafts.expire-after-hours=48
crm.visits.drafts.cleanup-batch-size=100
crm.visits.drafts.cleanup-cron=0 50 3 * * *

# ── Import kontaktów do kartoteki klientów ────────────────────────────────────
# Kod QR żyje krótko: to sekret wyświetlony na ekranie w warsztacie, a ma tylko dojść do
# telefonu stojącego obok. Sesja z wgranymi kontaktami żyje dłużej, żeby dało się wrócić
# do listy po przerwie — ale nie bezterminowo, bo trzyma czyjąś książkę adresową.
crm.customers.import.handoff-ttl-minutes=15
crm.customers.import.session-ttl-hours=4
crm.customers.import.max-contacts=5000
crm.customers.import.max-file-size-bytes=10485760
crm.customers.import.purge-cron=0 20 3 * * *

# ── Schemat: enumowe CHECK-i ──────────────────────────────────────────────────
# Hibernate w trybie ddl-auto=update dokłada przy zakładaniu tabeli CHECK z listą stałych
# enuma i nigdy go potem nie aktualizuje. Nowa stała w kodzie = błąd 23514 na produkcji,
# przy pierwszym jej użyciu. Ochrony nie daje żadnej (jedynym pisarzem tych kolumn jest
# Hibernate, który zapisuje tylko wartości enuma), więc sprzątamy je przy każdym starcie.
# Wyłączenie ma sens tylko przy diagnozowaniu samego mechanizmu.
crm.schema.drop-enum-check-constraints=true


# ─────────────────────────────────────────────────────────────────────────────
# Security hardening
# ─────────────────────────────────────────────────────────────────────────────
# Integracja telefoniczna (POST /api/v1/inbound/calls bez sesji): sekret w naglowku
# X-Inbound-Secret + jawne studioId w ciele. Pusty = wywolania anonimowe odrzucane
# (zalogowany uzytkownik CRM nadal rejestruje polaczenia we WLASNYM studiu).
inbound.calls.webhook-secret=${INBOUND_CALLS_WEBHOOK_SECRET:}

# Rate limiter honoruje CF-Connecting-IP / X-Forwarded-For wylacznie, gdy zadanie
# przyszlo od zaufanego proxy: loopback, sieci prywatne (docker) oraz ponizsze CIDR-y
# (lista po przecinku, np. zakresy Cloudflare gdy tunel stoi na innym hoscie).
security.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
