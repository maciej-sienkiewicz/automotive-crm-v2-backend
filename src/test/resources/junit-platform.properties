# Klasy testowe biegną równolegle na wątkach jednego JVM; metody w obrębie klasy — po kolei,
# na jednym wątku. Dzięki temu stan per-klasa (pola z mockami, @BeforeEach) i thread-local
# SecurityContextHolder działają bez zmian.
#
# Zmierzone na pełnym zestawie (1630 testów): ~95 s sekwencyjnie -> ~32 s.
#
# Test dotykający stanu GLOBALNEGO dla JVM (clearAllMocks(), mockkStatic/mockkObject,
# System.setProperty, Locale/TimeZone.setDefault) musi nosić @Isolated — inaczej psuje
# testy biegnące obok, a błąd wygląda na losowy i wskazuje na niewinną klasę.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
